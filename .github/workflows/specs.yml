name: Run rspec tests

on:
  - push
  - workflow_dispatch
  # - pull_request

jobs:
  # Functional tests for the dynamic page loader + translations menu.
  # Unlike the a11y suite, these must pass.
  dynamic-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ruby/setup-ruby@v1
        with:
          # Specified by .tool-versions
          bundler-cache: true
      - name: dynamic navigation tests
        run: bundle exec rspec utilities/specs --tag dynamic_nav

  a11y:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        # The files in /bjc-r/course/ (excluding the .html)
        # These correspond to rspec tags for each test run.
        course:
          - bjc4nyc
          - bjc4nyc.es
          - sparks
          - bjc4nyc_teacher
          - sparks-teacher
          - general
        suite:
          - wcag20
          - wcag22
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          # Specified by .tool-versions
          bundler-cache: true
      - name: a11y tests
        run: bundle exec rspec utilities/specs --tag ${{ matrix.course }}_${{ matrix.suite }}
      - name: summary
        if: always()
        run: ruby utilities/specs/spec_summary.rb

  self_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          # Specified by .tool-versions
          bundler-cache: true
      - name: self-check feedback tests
        run: bundle exec rspec utilities/specs/self_check_feedback_spec.rb

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 308" width="116" height="308" role="img" aria-labelledby="lgq-a-title" aria-describedby="lgq-a-desc" lang="en">
  <title id="lgq-a-title">Logic circuit II: (T OR F) AND NOT (T OR F)</title>
  <desc id="lgq-a-desc">A circuit diagram read from top to bottom. Inputs T and F feed an OR gate, and that OR gate feeds a NOT gate. Separately, a second pair of inputs T and F feed a second OR gate. The NOT gate and the second OR gate are the two inputs to an AND gate, and the AND gate produces the output of the circuit.</desc>
  <style>
    .bg { fill: #FFFFFF; }
    .shape { fill: none; stroke: #1A1A1A; stroke-width: 1.2; }
    text { fill: #1A1A1A; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; text-anchor: middle; }
  </style>
  <defs>
    <marker id="lgq-a-head" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#1A1A1A"/>
    </marker>
  </defs>
  <rect class="bg" width="116" height="308"/>
  <g class="shape">
    <circle cx="62.5" cy="15" r="15"/>
    <circle cx="100" cy="15" r="15"/>
    <circle cx="15" cy="155" r="15"/>
    <circle cx="52.5" cy="155" r="15"/>
    <rect x="52" y="50" width="59" height="27"/>
    <rect x="52" y="95" width="59" height="27"/>
    <rect x="4" y="190" width="59" height="27"/>
    <rect x="25" y="238" width="65" height="27"/>
    <line x1="62.5" y1="30" x2="62.5" y2="50" marker-end="url(#lgq-a-head)"/>
    <line x1="100" y1="30" x2="100" y2="50" marker-end="url(#lgq-a-head)"/>
    <line x1="81.5" y1="77" x2="81.5" y2="95" marker-end="url(#lgq-a-head)"/>
    <line x1="81.5" y1="122" x2="81.5" y2="238" marker-end="url(#lgq-a-head)"/>
    <line x1="15" y1="170" x2="15" y2="190" marker-end="url(#lgq-a-head)"/>
    <line x1="52.5" y1="170" x2="52.5" y2="190" marker-end="url(#lgq-a-head)"/>
    <line x1="33.5" y1="217" x2="33.5" y2="238" marker-end="url(#lgq-a-head)"/>
    <line x1="57.5" y1="265" x2="57.5" y2="286" marker-end="url(#lgq-a-head)"/>
  </g>
  <text x="62.5" y="19.32" font-size="12">T</text>
  <text x="100" y="19.32" font-size="12">F</text>
  <text x="15" y="159.32" font-size="12">T</text>
  <text x="52.5" y="159.32" font-size="12">F</text>
  <text x="81.5" y="68.18" font-size="13">OR</text>
  <text x="81.5" y="113.18" font-size="13">NOT</text>
  <text x="33.5" y="208.18" font-size="13">OR</text>
  <text x="57.5" y="256.18" font-size="13">AND</text>
  <text x="57.5" y="301.32" font-size="12">output</text>
</svg>

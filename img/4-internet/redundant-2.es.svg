<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 335 353" width="335" height="353" class="netgraph" lang="es" role="img" aria-labelledby="netgraph-title" aria-describedby="netgraph-desc">
  <title id="netgraph-title">Un modelo de red con un emisor, un receptor y diez nodos de retransmisión numerados</title>
  <desc id="netgraph-desc">Un modelo de red dibujado como un grafo. El emisor y el receptor están arriba y abajo, con 10 nodos de retransmisión numerados del 1 al 10 entre ellos y 19 conexiones en total. Conexiones: Emisor se conecta con 1, 2, 4; 1 se conecta con Emisor, 4, 5; 2 se conecta con Emisor, 3, 6, 8; 3 se conecta con 2, 4; 4 se conecta con Emisor, 1, 3, 7, 8; 5 se conecta con 1, 10; 6 se conecta con 2, 8, 9; 7 se conecta con 4, 10; 8 se conecta con 2, 4, 6, 9, 10, Receptor; 9 se conecta con 6, 8, Receptor; 10 se conecta con 5, 7, 8; Receptor se conecta con 8, 9.</desc>
  <style>
    .ng-bg { fill: #000000; }
    .ng-edge { stroke: #8DD54B; stroke-width: 3; stroke-linecap: round; }
    .ng-node { fill: #C9E9FB; }
    .ng-endpoint { fill: #F1358C; }
    .ng-num { fill: #06263D; font: 700 13px system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; text-anchor: middle; }
    .ng-label { fill: #FFFFFF; font: 600 17px system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    /* Windows High Contrast Mode: the glow and the fixed palette are
       both dropped, so fall back to the user's own colours. */
    @media (forced-colors: active) {
      .ng-bg { fill: Canvas; }
      .ng-edge { stroke: CanvasText; }
      .ng-node, .ng-endpoint { fill: Canvas; stroke: CanvasText; stroke-width: 2; }
      .ng-num, .ng-label { fill: CanvasText; }
      .ng-glow { filter: none; }
    }
  </style>
  <defs>
    <filter id="netgraph-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect class="ng-bg" width="335" height="353"/>
  <g class="ng-glow" filter="url(#netgraph-glow)">
    <g class="ng-edges">
      <line class="ng-edge" data-from="Emisor" data-to="1" x1="85.5" y1="23.5" x2="224.0" y2="89.0"/>
      <line class="ng-edge" data-from="Emisor" data-to="2" x1="85.5" y1="23.5" x2="24.0" y2="101.0"/>
      <line class="ng-edge" data-from="Emisor" data-to="4" x1="85.5" y1="23.5" x2="145.5" y2="143.0"/>
      <line class="ng-edge" data-from="Receptor" data-to="9" x1="85.5" y1="329.5" x2="42.5" y2="276.0"/>
      <line class="ng-edge" data-from="Receptor" data-to="8" x1="85.5" y1="329.5" x2="129.0" y2="233.0"/>
      <line class="ng-edge" data-from="3" data-to="2" x1="73.5" y1="101.5" x2="24.0" y2="101.0"/>
      <line class="ng-edge" data-from="3" data-to="4" x1="73.5" y1="101.5" x2="145.5" y2="143.0"/>
      <line class="ng-edge" data-from="7" data-to="10" x1="217.5" y1="203.5" x2="199.5" y2="301.5"/>
      <line class="ng-edge" data-from="7" data-to="4" x1="217.5" y1="203.5" x2="145.5" y2="143.0"/>
      <line class="ng-edge" data-from="5" data-to="10" x1="308.5" y1="155.5" x2="199.5" y2="301.5"/>
      <line class="ng-edge" data-from="5" data-to="1" x1="308.5" y1="155.5" x2="224.0" y2="89.0"/>
      <line class="ng-edge" data-from="6" data-to="9" x1="55.5" y1="185.0" x2="42.5" y2="276.0"/>
      <line class="ng-edge" data-from="6" data-to="2" x1="55.5" y1="185.0" x2="24.0" y2="101.0"/>
      <line class="ng-edge" data-from="6" data-to="8" x1="55.5" y1="185.0" x2="129.0" y2="233.0"/>
      <line class="ng-edge" data-from="9" data-to="8" x1="42.5" y1="276.0" x2="129.0" y2="233.0"/>
      <line class="ng-edge" data-from="10" data-to="8" x1="199.5" y1="301.5" x2="129.0" y2="233.0"/>
      <line class="ng-edge" data-from="1" data-to="4" x1="224.0" y1="89.0" x2="145.5" y2="143.0"/>
      <line class="ng-edge" data-from="2" data-to="8" x1="24.0" y1="101.0" x2="129.0" y2="233.0"/>
      <line class="ng-edge" data-from="4" data-to="8" x1="145.5" y1="143.0" x2="129.0" y2="233.0"/>
    </g>
    <g class="ng-nodes">
      <g class="ng-node-group" data-node="Emisor" data-role="sender" data-x="85.5" data-y="23.5">
        <circle class="ng-endpoint" cx="85.5" cy="23.5" r="12"/>
      </g>
      <g class="ng-node-group" data-node="1" data-role="relay" data-x="224.0" data-y="89.0">
        <circle class="ng-node" cx="224.0" cy="89.0" r="11"/>
        <text class="ng-num" x="224.0" y="93.5">1</text>
      </g>
      <g class="ng-node-group" data-node="2" data-role="relay" data-x="24.0" data-y="101.0">
        <circle class="ng-node" cx="24.0" cy="101.0" r="11"/>
        <text class="ng-num" x="24.0" y="105.5">2</text>
      </g>
      <g class="ng-node-group" data-node="3" data-role="relay" data-x="73.5" data-y="101.5">
        <circle class="ng-node" cx="73.5" cy="101.5" r="11"/>
        <text class="ng-num" x="73.5" y="106.0">3</text>
      </g>
      <g class="ng-node-group" data-node="4" data-role="relay" data-x="145.5" data-y="143.0">
        <circle class="ng-node" cx="145.5" cy="143.0" r="11"/>
        <text class="ng-num" x="145.5" y="147.5">4</text>
      </g>
      <g class="ng-node-group" data-node="5" data-role="relay" data-x="308.5" data-y="155.5">
        <circle class="ng-node" cx="308.5" cy="155.5" r="11"/>
        <text class="ng-num" x="308.5" y="160.0">5</text>
      </g>
      <g class="ng-node-group" data-node="6" data-role="relay" data-x="55.5" data-y="185.0">
        <circle class="ng-node" cx="55.5" cy="185.0" r="11"/>
        <text class="ng-num" x="55.5" y="189.5">6</text>
      </g>
      <g class="ng-node-group" data-node="7" data-role="relay" data-x="217.5" data-y="203.5">
        <circle class="ng-node" cx="217.5" cy="203.5" r="11"/>
        <text class="ng-num" x="217.5" y="208.0">7</text>
      </g>
      <g class="ng-node-group" data-node="8" data-role="relay" data-x="129.0" data-y="233.0">
        <circle class="ng-node" cx="129.0" cy="233.0" r="11"/>
        <text class="ng-num" x="129.0" y="237.5">8</text>
      </g>
      <g class="ng-node-group" data-node="9" data-role="relay" data-x="42.5" data-y="276.0">
        <circle class="ng-node" cx="42.5" cy="276.0" r="11"/>
        <text class="ng-num" x="42.5" y="280.5">9</text>
      </g>
      <g class="ng-node-group" data-node="10" data-role="relay" data-x="199.5" data-y="301.5">
        <circle class="ng-node" cx="199.5" cy="301.5" r="11"/>
        <text class="ng-num" x="199.5" y="306.0">10</text>
      </g>
      <g class="ng-node-group" data-node="Receptor" data-role="receiver" data-x="85.5" data-y="329.5">
        <circle class="ng-endpoint" cx="85.5" cy="329.5" r="12"/>
      </g>
    </g>
  </g>
  <g class="ng-labels">
    <text class="ng-label" x="104.5" y="29.5">Emisor</text>
    <text class="ng-label" x="104.5" y="335.5">Receptor</text>
  </g>
</svg>

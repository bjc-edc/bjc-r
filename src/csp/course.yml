# A compiled course. `bundle exec ruby utilities/build-tools/compile.rb` turns
# this folder into the course page, topic files, and pages that llab serves.
# See utilities/build-tools/README.md.

# The folder name. The course is served at /bjc-r/csp/ and its course page is
# /bjc-r/course/csp.html.
id: csp
title: 'The Beauty and Joy of Computing: AP CS Principles'
language: en

# The units, in teaching order. Unit, lab, and page numbers come from this list
# and from the order of the topic files, so reordering is an edit here or there.
units:
  - 1-introduction.topic
